# This workflow runs tests and then publishes the package to npm when a
# release is created, using npm's OIDC trusted publishing (no npm token
# secret required). See: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # Trusted publishing requires npm CLI >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build:lib
      - run: npm publish
